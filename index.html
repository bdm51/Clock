<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Wall Clock</title>
<style>
  * {
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #090a0d;
    overflow: hidden;
  }

  /* Each design gets its own full-screen layer, stacked on top of each
     other. Only one is display:block at a time; the other is display:none.
     Moving flex-centering here (off body) means toggling doesn't disturb
     layout of whichever one becomes visible. */
  .view {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: -webkit-flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #view-jones {
    display: flex;
    background: #090a0d;
  }
  #view-railway {
    display: none;
    background: #050505;
  }

  /* Invisible tap target centered on the dial's pivot point, above both
     designs, used to toggle between them. Sized generously (44px+) for a
     reliable touch target on an old, less-precise digitizer. */
  #tap-zone {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22vmin;
    height: 22vmin;
    min-width: 60px;
    min-height: 60px;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    z-index: 1000;
    background: transparent;
  }

  /* ===================== Jones "Movie Retro" design ===================== */

  #j-case {
    position: relative;
    border-radius: 12%;
    background:
      -webkit-radial-gradient(20% 0%, circle, #4a4b50 0%, #1b1c20 40%, #101115 80%),
      -webkit-linear-gradient(145deg, #323338, #111114 50%, #1d1e22);
    background:
      radial-gradient(circle at 20% 0%, #4a4b50 0%, #1b1c20 40%, #101115 80%),
      linear-gradient(145deg, #323338, #111114 50%, #1d1e22);
    box-shadow:
      0 4vmin 8vmin rgba(0,0,0,0.9),
      0 1vmin 2vmin rgba(0,0,0,0.6),
      inset 0 0.6vmin 1.2vmin rgba(255,255,255,0.18),
      inset 0 -0.8vmin 1.6vmin rgba(0,0,0,0.95);
    padding: 3.5%;
    -webkit-transform: rotateX(0deg) rotateY(0deg);
    transform: rotateX(0deg) rotateY(0deg);
  }

  #j-clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 9%;
    background:
      -webkit-radial-gradient(45% 35%, circle, #faf6e8 0%, #f1e8c7 55%, #dfd3a0 100%),
      -webkit-repeating-linear-gradient(0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0.02) 2px,
        rgba(0,0,0,0.02) 3px);
    background:
      radial-gradient(circle at 45% 35%, #faf6e8 0%, #f1e8c7 55%, #dfd3a0 100%),
      repeating-linear-gradient(0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0.02) 2px,
        rgba(0,0,0,0.02) 3px);
    box-shadow:
      inset 0 0 3vmin rgba(0,0,0,0.35),
      inset 0 1.2vmin 2.4vmin rgba(0,0,0,0.25);
    overflow: hidden;
  }

  #j-clock::before {
    content: '';
    position: absolute;
    top: 1.5%; right: 1.5%; bottom: 1.5%; left: 1.5%;
    border-radius: 8%;
    border: 0.25vmin solid rgba(0,0,0,0.35);
    box-shadow:
      inset 0 0.4vmin 0.8vmin rgba(255,255,255,0.25),
      0 0.4vmin 0.8vmin rgba(0,0,0,0.35);
    pointer-events: none;
  }

  #j-glass {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 9%;
    background:
      -webkit-radial-gradient(50% 18%, circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 40%, transparent 70%),
      -webkit-radial-gradient(10% 0%, circle, rgba(255,255,255,0.2) 0%, transparent 55%),
      -webkit-radial-gradient(90% 100%, circle, rgba(0,0,0,0.28) 0%, transparent 60%),
      -webkit-linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 30%, transparent 60%, rgba(255,255,255,0.06) 100%);
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 40%, transparent 70%),
      radial-gradient(circle at 10% 0%, rgba(255,255,255,0.2) 0%, transparent 55%),
      radial-gradient(circle at 90% 100%, rgba(0,0,0,0.28) 0%, transparent 60%),
      linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 30%, transparent 60%, rgba(255,255,255,0.06) 100%);
    pointer-events: none;
    z-index: 10;
  }

  #j-clock::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 9%;
    background: -webkit-radial-gradient(50% 50%, circle, transparent 60%, rgba(0,0,0,0.25) 100%);
    background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.25) 100%);
    pointer-events: none;
    z-index: 2;
  }

  #j-hands-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
  }

  #view-jones .hand {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
  }

  #j-hour {
    width: 4.4%;
    height: 26%;
    margin-left: -2.2%;
    margin-top: -26%;
    background:
      -webkit-linear-gradient(0deg, #0d0d0d, #2c2c2c 40%, #5a5a5a 60%, #1a1a1a 100%);
    background:
      linear-gradient(90deg, #0d0d0d, #2c2c2c 40%, #5a5a5a 60%, #1a1a1a 100%);
    -webkit-clip-path: polygon(50% 0%, 74% 18%, 74% 100%, 26% 100%, 26% 18%);
    clip-path: polygon(50% 0%, 74% 18%, 74% 100%, 26% 100%, 26% 18%);
    border-radius: 2vmin 2vmin 0 0;
  }

  #j-minute {
    width: 3.4%;
    height: 36%;
    margin-left: -1.7%;
    margin-top: -36%;
    background:
      -webkit-linear-gradient(0deg, #0a0a0a, #2e2e2e 35%, #666666 55%, #2e2e2e 75%, #101010 100%);
    background:
      linear-gradient(90deg, #0a0a0a, #2e2e2e 35%, #666666 55%, #2e2e2e 75%, #101010 100%);
    -webkit-clip-path: polygon(50% 0%, 72% 16%, 72% 100%, 28% 100%, 28% 16%);
    clip-path: polygon(50% 0%, 72% 16%, 72% 100%, 28% 100%, 28% 16%);
    border-radius: 2vmin 2vmin 0 0;
  }

  #j-second {
    width: 0.6%;
    height: 34%;
    margin-left: -0.3%;
    margin-top: -24%;
    background: #b22222;
    -webkit-transform-origin: 50% 72.7%;
    transform-origin: 50% 72.7%;
    z-index: 4;
  }

  #j-second-counterweight {
    position: absolute;
    bottom: -18%;
    left: 50%;
    width: 1.8vmin;
    height: 1.8vmin;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    border-radius: 50%;
    background:
      -webkit-radial-gradient(30% 30%, circle, #ff6666, #7a1010);
    background:
      radial-gradient(circle at 30% 30%, #ff6666, #7a1010);
    box-shadow: 0 0.25vmin 0.45vmin rgba(0,0,0,0.7);
  }

  #view-jones .number {
    position: absolute;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    color: #1f1f1f;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    line-height: 1;
    text-shadow: 0.1vmin 0.15vmin 0.1vmin rgba(255,255,255,0.4),
                 -0.1vmin -0.1vmin 0.2vmin rgba(0,0,0,0.25);
  }

  #view-jones .dot {
    position: absolute;
    background: #1f1f1f;
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    box-shadow: 0.1vmin 0.15vmin 0.1vmin rgba(255,255,255,0.3);
  }

  #view-jones .radial-major,
  #view-jones .radial-minor {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 0%;
    transform-origin: 50% 0%;
    -webkit-transform: translate(-50%, 0);
    transform: translate(-50%, 0);
    background: #1f1f1f;
    opacity: 0.15;
    box-shadow: 0.08vmin 0.12vmin 0.12vmin rgba(255,255,255,0.15);
  }

  #view-jones .radial-major {
    width: 0.35%;
    height: 20%;
  }

  #view-jones .radial-minor {
    width: 0.18%;
    height: 12%;
    opacity: 0.09;
  }

  #j-inner-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 0.2vmin dotted rgba(31,31,31,0.15);
  }

  #j-pivot {
    position: absolute;
    top: 50%;
    left: 50%;
    background:
      -webkit-radial-gradient(35% 30%, circle, #999, #222);
    background:
      radial-gradient(circle at 35% 30%, #999, #222);
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    box-shadow:
      0 0.4vmin 0.7vmin rgba(0,0,0,0.9),
      inset 0 0.12vmin 0.24vmin rgba(255,255,255,0.5);
    z-index: 6;
  }

  #j-brand {
    position: absolute;
    top: 27%;
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    font-family: "Georgia", serif;
    letter-spacing: 0.18em;
    color: #222;
    opacity: 0.55;
    text-shadow:
      0.08vmin 0.12vmin 0.12vmin rgba(255,255,255,0.5),
      -0.08vmin -0.12vmin 0.18vmin rgba(0,0,0,0.35);
  }

  /* ===================== Railway Station design ===================== */

  #r-case {
    position: relative;
    border-radius: 4%;
    background: -webkit-linear-gradient(180deg, #2a2a2a, #0c0c0c);
    background: linear-gradient(180deg, #2a2a2a, #0c0c0c);
    box-shadow:
      0 3vmin 6vmin rgba(0,0,0,0.7),
      inset 0 0 0.4vmin rgba(255,255,255,0.1);
    padding: 2.6%;
  }

  #r-clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 2%;
    background: #f6f5f0;
    box-shadow: inset 0 0 1vmin rgba(0,0,0,0.15);
    overflow: hidden;
  }

  #r-hands-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
  }

  #view-railway .hand {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
  }

  #r-hour {
    width: 3.6%;
    height: 25%;
    margin-left: -1.8%;
    margin-top: -25%;
    background: #111;
    -webkit-clip-path: polygon(50% 0%, 72% 22%, 72% 100%, 28% 100%, 28% 22%);
    clip-path: polygon(50% 0%, 72% 22%, 72% 100%, 28% 100%, 28% 22%);
  }

  #r-minute {
    width: 2.6%;
    height: 37%;
    margin-left: -1.3%;
    margin-top: -37%;
    background: #111;
    -webkit-clip-path: polygon(50% 0%, 70% 16%, 70% 100%, 30% 100%, 30% 16%);
    clip-path: polygon(50% 0%, 70% 16%, 70% 100%, 30% 100%, 30% 16%);
  }

  #r-second {
    width: 0.55%;
    height: 42%;
    margin-left: -0.275%;
    margin-top: -30%;
    background: #c8102e;
    -webkit-transform-origin: 50% 71.4%;
    transform-origin: 50% 71.4%;
    z-index: 5;
  }
  #r-second-tail {
    position: absolute;
    bottom: -14%;
    left: 50%;
    width: 0.55%;
    height: 14%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    background: #c8102e;
  }

  #view-railway .number {
    position: absolute;
    font-family: Arial, 'Helvetica Neue', sans-serif;
    font-weight: 700;
    color: #111;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    line-height: 1;
  }

  #r-date-window {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    background: #fff;
    border: 0.18vmin solid #111;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #r-date-window span {
    font-family: Arial, 'Helvetica Neue', sans-serif;
    font-weight: 700;
    color: #111;
    line-height: 1;
  }

  #view-railway .tick-major,
  #view-railway .tick-minor {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 0%;
    transform-origin: 50% 0%;
    background: #111;
  }
  #view-railway .tick-major {
    width: 0.4%;
    height: 8%;
  }
  #view-railway .tick-minor {
    width: 0.18%;
    height: 4%;
    opacity: 0.7;
  }

  #r-pivot {
    position: absolute;
    top: 50%;
    left: 50%;
    background: #111;
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    z-index: 6;
  }
</style>
</head>
<body>

<div id="view-jones" class="view">
  <div id="j-case">
    <div id="j-clock">
      <div id="j-brand">Jones</div>
      <div id="j-inner-ring"></div>
      <div id="j-hands-stage">
        <div id="j-hour" class="hand"></div>
        <div id="j-minute" class="hand"></div>
        <div id="j-second" class="hand">
          <div id="j-second-counterweight"></div>
        </div>
        <div id="j-pivot"></div>
      </div>
      <div id="j-glass"></div>
    </div>
  </div>
</div>

<div id="view-railway" class="view">
  <div id="r-case">
    <div id="r-clock">
      <div id="r-date-window"><span id="r-date-num"></span></div>
      <div id="r-hands-stage">
        <div id="r-hour" class="hand"></div>
        <div id="r-minute" class="hand"></div>
        <div id="r-second" class="hand">
          <div id="r-second-tail"></div>
        </div>
        <div id="r-pivot"></div>
      </div>
    </div>
  </div>
</div>

<div id="tap-zone"></div>

<script>
// ===================== Jones "Movie Retro" design =====================
var Jones = (function () {
  var caseEl = document.getElementById('j-case');
  var clock = document.getElementById('j-clock');
  var handsStage = document.getElementById('j-hands-stage');
  var innerRing = document.getElementById('j-inner-ring');
  var pivot = document.getElementById('j-pivot');
  var brand = document.getElementById('j-brand');
  var built = false;

  function layout() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var caseW = Math.min(vw, vh * 1.5);
    var caseH = caseW * (2 / 3);
    if (caseH > vh) {
      caseH = vh;
      caseW = caseH * 1.5;
    }
    caseEl.style.width = caseW + 'px';
    caseEl.style.height = caseH + 'px';

    var clockRect = clock.getBoundingClientRect();
    var dialH = clockRect.height;
    var dialW = clockRect.width;

    handsStage.style.width = dialH + 'px';
    handsStage.style.height = dialH + 'px';

    var ringSize = dialW * 0.11;
    innerRing.style.width = ringSize + 'px';
    innerRing.style.height = ringSize + 'px';

    var pivotSize = dialH * 0.024;
    pivot.style.width = pivotSize + 'px';
    pivot.style.height = pivotSize + 'px';

    var numSize = Math.max(19, Math.min(dialH * 0.24, 51));
    var dots = clock.getElementsByClassName('dot');
    var numbers = clock.getElementsByClassName('number');
    for (var i = 0; i < numbers.length; i++) {
      numbers[i].style.fontSize = numSize + 'px';
    }
    var dotSize = dialW * 0.013;
    for (var j = 0; j < dots.length; j++) {
      dots[j].style.width = dotSize + 'px';
      dots[j].style.height = dotSize + 'px';
    }
    brand.style.fontSize = Math.max(9, Math.min(dialH * 0.09, 16)) + 'px';
  }

  var RX_NUM = 40, RY_NUM = 33;
  var RX_DOT = 40, RY_DOT = 33;

  function polar(rx, ry, angleDeg) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: 50 + rx * Math.cos(rad),
      y: 50 + ry * Math.sin(rad)
    };
  }

  function build() {
    if (built) return;
    built = true;

    var numerals = [
      { label: '12', angle: 0 },
      { label: '3',  angle: 90 },
      { label: '6',  angle: 180 },
      { label: '9',  angle: 270 }
    ];
    for (var n = 0; n < numerals.length; n++) {
      var pos = polar(RX_NUM, RY_NUM, numerals[n].angle);
      var el = document.createElement('div');
      el.className = 'number';
      el.textContent = numerals[n].label;
      el.style.left = pos.x + '%';
      el.style.top = pos.y + '%';
      clock.appendChild(el);
    }

    var dotAngles = [30, 60, 120, 150, 210, 240, 300, 330];
    for (var d = 0; d < dotAngles.length; d++) {
      var dpos = polar(RX_DOT, RY_DOT, dotAngles[d]);
      var dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = dpos.x + '%';
      dot.style.top = dpos.y + '%';
      clock.appendChild(dot);
    }

    for (var i = 0; i < 60; i++) {
      var angle = i * 6;
      var isMajor = i % 5 === 0;
      var line = document.createElement('div');
      line.className = isMajor ? 'radial-major' : 'radial-minor';
      var t = 'translate(-50%, 0) rotate(' + angle + 'deg)';
      line.style.webkitTransform = t;
      line.style.transform = t;
      clock.appendChild(line);
    }
  }

  var hourHand = document.getElementById('j-hour');
  var minuteHand = document.getElementById('j-minute');
  var secondHand = document.getElementById('j-second');

  function update() {
    var now = new Date();
    var sec = now.getSeconds();
    var min = now.getMinutes();
    var hr  = now.getHours() % 12;

    var secBase = sec * 6;
    var secOvershoot = secBase + (sec % 2 === 0 ? 0.8 : -0.4);

    var secT = 'rotate(' + secOvershoot + 'deg)';
    var minT = 'rotate(' + ((min * 6) + (sec * 0.1)) + 'deg)';
    var hrT  = 'rotate(' + ((hr * 30) + (min * 0.5)) + 'deg)';

    secondHand.style.webkitTransform = secT;
    secondHand.style.transform = secT;
    minuteHand.style.webkitTransform = minT;
    minuteHand.style.transform = minT;
    hourHand.style.webkitTransform = hrT;
    hourHand.style.transform = hrT;
  }

  // Parallax tilt (fires directly on iOS 10 — no permission gate exists yet)
  (function setupParallax() {
    var glassEl = document.getElementById('j-glass');

    function applyTilt(beta, gamma) {
      var maxTilt = 4;
      var xTilt = (gamma / 45) * maxTilt;
      var yTilt = (beta / 45) * maxTilt;

      var caseT = 'rotateX(' + (yTilt * 0.25) + 'deg) rotateY(' + (xTilt * 0.25) + 'deg)';
      var glassT = 'translate(-1%, -1%) rotateX(' + (yTilt * 0.6) + 'deg) rotateY(' + (xTilt * 0.6) + 'deg)';

      caseEl.style.webkitTransform = caseT;
      caseEl.style.transform = caseT;
      glassEl.style.webkitTransform = glassT;
      glassEl.style.transform = glassT;
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function (event) {
        var beta = event.beta || 0;
        var gamma = event.gamma || 0;
        applyTilt(beta, gamma);
      }, true);
    }
  })();

  build();

  return { layout: layout, update: update };
})();

// ===================== Railway Station design =====================
var Railway = (function () {
  var caseEl = document.getElementById('r-case');
  var clock = document.getElementById('r-clock');
  var handsStage = document.getElementById('r-hands-stage');
  var pivot = document.getElementById('r-pivot');
  var dateWindow = document.getElementById('r-date-window');
  var dateNum = document.getElementById('r-date-num');
  var dialW_g = 0;
  var dialH_g = 0;
  var built = false;

  function layout() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var caseW = Math.min(vw, vh * 1.5);
    var caseH = caseW * (2 / 3);
    if (caseH > vh) {
      caseH = vh;
      caseW = caseH * 1.5;
    }
    caseEl.style.width = caseW + 'px';
    caseEl.style.height = caseH + 'px';

    var clockRect = clock.getBoundingClientRect();
    var dialH = clockRect.height;
    var dialW = clockRect.width;

    dialW_g = dialW;
    dialH_g = dialH;

    handsStage.style.width = dialH + 'px';
    handsStage.style.height = dialH + 'px';

    var pivotSize = dialH * 0.022;
    pivot.style.width = pivotSize + 'px';
    pivot.style.height = pivotSize + 'px';

    var numSize = Math.max(16, Math.min(dialH * 0.16, 40));
    var numbers = clock.getElementsByClassName('number');
    for (var i = 0; i < numbers.length; i++) {
      numbers[i].style.fontSize = numSize + 'px';
    }

    var winW = dialH * 0.16;
    var winH = dialH * 0.12;
    dateWindow.style.width = winW + 'px';
    dateWindow.style.height = winH + 'px';
    dateNum.style.fontSize = Math.max(13, Math.min(dialH * 0.11, 28)) + 'px';

    var dateOffsetPx = dialH * 0.33;
    dateWindow.style.left = (dialW / 2 + dateOffsetPx) + 'px';
    dateWindow.style.top = (dialH / 2) + 'px';
  }

  var RX_NUM = 41, RY_NUM = 32;

  function polar(rx, ry, angleDeg) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: 50 + rx * Math.cos(rad),
      y: 50 + ry * Math.sin(rad)
    };
  }

  function build() {
    if (built) return;
    built = true;

    for (var h = 1; h <= 12; h++) {
      var angle = h * 30;
      var pos = polar(RX_NUM, RY_NUM, angle);
      var el = document.createElement('div');
      el.className = 'number';
      el.textContent = String(h);
      el.style.left = pos.x + '%';
      el.style.top = pos.y + '%';
      clock.appendChild(el);
    }

    for (var i = 0; i < 60; i++) {
      var tAngle = i * 6;
      var isMajor = i % 5 === 0;
      var tick = document.createElement('div');
      tick.className = isMajor ? 'tick-major' : 'tick-minor';
      var t = 'translate(-50%, 0) rotate(' + tAngle + 'deg)';
      tick.style.webkitTransform = t;
      tick.style.transform = t;
      clock.appendChild(tick);
    }
  }

  var hourHand = document.getElementById('r-hour');
  var minuteHand = document.getElementById('r-minute');
  var secondHand = document.getElementById('r-second');

  function update() {
    var now = new Date();
    var sec = now.getSeconds();
    var min = now.getMinutes();
    var hr  = now.getHours() % 12;

    var secAngle = sec * 6;
    var secT = 'rotate(' + secAngle + 'deg)';
    var minT = 'rotate(' + ((min * 6) + (sec * 0.1)) + 'deg)';
    var hrT  = 'rotate(' + ((hr * 30) + (min * 0.5)) + 'deg)';

    if (dialW_g && dialH_g) {
      var a = dialW_g * 0.42;
      var b = dialH_g * 0.42;
      var phi = secAngle * Math.PI / 180;
      var lenPx = (a * b) / Math.sqrt(
        Math.pow(b * Math.sin(phi), 2) + Math.pow(a * Math.cos(phi), 2)
      );
      var pivotFraction = 0.714;
      secondHand.style.height = lenPx + 'px';
      secondHand.style.marginTop = (-pivotFraction * lenPx) + 'px';
    }

    secondHand.style.webkitTransform = secT;
    secondHand.style.transform = secT;
    minuteHand.style.webkitTransform = minT;
    minuteHand.style.transform = minT;
    hourHand.style.webkitTransform = hrT;
    hourHand.style.transform = hrT;

    dateNum.textContent = String(now.getDate());
  }

  build();

  return { layout: layout, update: update };
})();

// ===================== Shared: layout, ticking, toggle =====================
function layoutAll() {
  Jones.layout();
  Railway.layout();
}
function updateAll() {
  Jones.update();
  Railway.update();
}

layoutAll();
window.addEventListener('resize', layoutAll);
window.addEventListener('orientationchange', function () {
  setTimeout(layoutAll, 100);
});

updateAll();
setInterval(updateAll, 1000);

// Tap the center of the dial to switch between designs
(function setupToggle() {
  var viewJones = document.getElementById('view-jones');
  var viewRailway = document.getElementById('view-railway');
  var tapZone = document.getElementById('tap-zone');
  var showingJones = true;

  function toggle() {
    showingJones = !showingJones;
    viewJones.style.display = showingJones ? 'flex' : 'none';
    viewRailway.style.display = showingJones ? 'none' : 'flex';
    // Re-measure the newly visible view — its dial was un-rendered
    // (display:none) while hidden, so getBoundingClientRect() would have
    // returned zeros for it during any layout() calls while it was off.
    layoutAll();
    updateAll();
  }

  tapZone.addEventListener('click', toggle);
  tapZone.addEventListener('touchend', function (e) {
    e.preventDefault();
    toggle();
  });
})();
</script>

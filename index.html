<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wall Clock</title>
<style>
  /* Self-hosted — same origin as this page (GitHub Pages), so no
     separate certificate-trust risk the way the Google Fonts CDN had */
  @font-face {
    font-family: 'Orbitron';
    src: url('Orbitron-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }
</style>
<style>
  * {
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #090a0d;
    overflow: hidden;
  }

  /* Each design gets its own full-screen layer. Only one is displayed at
     a time; toggling swaps which is display:block/flex. Flex-centering
     lives here (not on body) so toggling doesn't disturb layout. */
  .view {
    position: absolute;
    /* black-translucent means the status bar no longer reserves its own
       space — page content now extends underneath it. Without this
       top offset, the clock face could render directly behind the
       time/battery icons rather than just below them. ~20px matches
       the classic iPad status bar height. Height is reduced to match
       so nothing overflows off the bottom edge. */
    top: 20px; left: 0;
    width: 100%;
    height: calc(100% - 20px);
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #view-jones {
    display: -webkit-flex;
    display: flex;
    background: #090a0d;
  }
  #view-karlsson {
    display: none;
    background: #14100c;
  }

  /* Invisible tap target over the pivot, above both designs, used to
     toggle between them. Sized generously for a reliable touch target
     on an older, less precise digitizer. */
  #tap-zone {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22vmin;
    height: 22vmin;
    min-width: 60px;
    min-height: 60px;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    z-index: 1000;
    background: transparent;
  }

  /* ===================== Jones "Movie Retro" design ===================== */

  #j-case {
    position: relative;
    border-radius: 12%;
    background:
      -webkit-radial-gradient(20% 0%, circle, #4a4b50 0%, #1b1c20 40%, #101115 80%),
      -webkit-linear-gradient(145deg, #323338, #111114 50%, #1d1e22);
    background:
      radial-gradient(circle at 20% 0%, #4a4b50 0%, #1b1c20 40%, #101115 80%),
      linear-gradient(145deg, #323338, #111114 50%, #1d1e22);
    box-shadow:
      0 4vmin 8vmin rgba(0,0,0,0.9),
      0 1vmin 2vmin rgba(0,0,0,0.6),
      inset 0 0.6vmin 1.2vmin rgba(255,255,255,0.18),
      inset 0 -0.8vmin 1.6vmin rgba(0,0,0,0.95);
    padding: 1.8%;
    -webkit-transform: rotateX(0deg) rotateY(0deg);
    transform: rotateX(0deg) rotateY(0deg);
  }

  #j-clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 9%;
    background:
      -webkit-radial-gradient(45% 35%, circle, #faf6e8 0%, #f1e8c7 55%, #dfd3a0 100%),
      -webkit-repeating-linear-gradient(0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0.02) 2px,
        rgba(0,0,0,0.02) 3px);
    background:
      radial-gradient(circle at 45% 35%, #faf6e8 0%, #f1e8c7 55%, #dfd3a0 100%),
      repeating-linear-gradient(0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0.02) 2px,
        rgba(0,0,0,0.02) 3px);
    box-shadow:
      inset 0 0 3vmin rgba(0,0,0,0.35),
      inset 0 1.2vmin 2.4vmin rgba(0,0,0,0.25);
    overflow: hidden;
  }

  #j-clock::before {
    content: '';
    position: absolute;
    top: 1.5%; right: 1.5%; bottom: 1.5%; left: 1.5%;
    border-radius: 8%;
    border: 0.25vmin solid rgba(0,0,0,0.35);
    box-shadow:
      inset 0 0.4vmin 0.8vmin rgba(255,255,255,0.25),
      0 0.4vmin 0.8vmin rgba(0,0,0,0.35);
    pointer-events: none;
  }

  #j-glass {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 9%;
    background:
      -webkit-radial-gradient(50% 18%, circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 40%, transparent 70%),
      -webkit-radial-gradient(10% 0%, circle, rgba(255,255,255,0.2) 0%, transparent 55%),
      -webkit-radial-gradient(90% 100%, circle, rgba(0,0,0,0.28) 0%, transparent 60%),
      -webkit-linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 30%, transparent 60%, rgba(255,255,255,0.06) 100%);
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 40%, transparent 70%),
      radial-gradient(circle at 10% 0%, rgba(255,255,255,0.2) 0%, transparent 55%),
      radial-gradient(circle at 90% 100%, rgba(0,0,0,0.28) 0%, transparent 60%),
      linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 30%, transparent 60%, rgba(255,255,255,0.06) 100%);
    pointer-events: none;
    z-index: 10;
  }

  #j-clock::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 9%;
    background: -webkit-radial-gradient(50% 50%, circle, transparent 60%, rgba(0,0,0,0.25) 100%);
    background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.25) 100%);
    pointer-events: none;
    z-index: 2;
  }

  #j-hands-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
  }

  #view-jones .hand {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
  }

  #j-hour {
    width: 4.4%;
    height: 26%;
    margin-left: -2.2%;
    margin-top: -26%;
    background:
      -webkit-linear-gradient(0deg, #0d0d0d, #2c2c2c 40%, #5a5a5a 60%, #1a1a1a 100%);
    background:
      linear-gradient(90deg, #0d0d0d, #2c2c2c 40%, #5a5a5a 60%, #1a1a1a 100%);
    -webkit-clip-path: polygon(50% 0%, 74% 18%, 74% 100%, 26% 100%, 26% 18%);
    clip-path: polygon(50% 0%, 74% 18%, 74% 100%, 26% 100%, 26% 18%);
    border-radius: 2vmin 2vmin 0 0;
  }

  #j-minute {
    width: 3.4%;
    height: 36%;
    margin-left: -1.7%;
    margin-top: -36%;
    background:
      -webkit-linear-gradient(0deg, #0a0a0a, #2e2e2e 35%, #666666 55%, #2e2e2e 75%, #101010 100%);
    background:
      linear-gradient(90deg, #0a0a0a, #2e2e2e 35%, #666666 55%, #2e2e2e 75%, #101010 100%);
    -webkit-clip-path: polygon(50% 0%, 72% 16%, 72% 100%, 28% 100%, 28% 16%);
    clip-path: polygon(50% 0%, 72% 16%, 72% 100%, 28% 100%, 28% 16%);
    border-radius: 2vmin 2vmin 0 0;
  }

  /* Second hand, rebuilt as a rotor + two simple children, replacing the
     old single-box-with-fractional-transform-origin approach. That
     required getting margin-top, height, and transform-origin% all
     precisely consistent with each other (a fragile 3-way calculation
     that kept landing slightly off-center). This rotor is full-size, so
     its own center is exactly the stage's center with no math involved
     — the visible head/tail inside it use plain 0%/100% positioning,
     which is inherently exact. */
  #j-second-rotor {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #j-second-head {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0.6%;
    height: 24.7%;
    margin-left: -0.3%;
    margin-top: -24.7%;
    background: #b22222;
  }
  #j-second-tail {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0.6%;
    height: 9.3%;
    margin-left: -0.3%;
    background: #b22222;
  }

  #j-second-counterweight {
    position: absolute;
    bottom: -40%;
    left: 50%;
    width: 1.8vmin;
    height: 1.8vmin;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    border-radius: 50%;
    background:
      -webkit-radial-gradient(30% 30%, circle, #ff6666, #7a1010);
    background:
      radial-gradient(circle at 30% 30%, #ff6666, #7a1010);
    box-shadow: 0 0.25vmin 0.45vmin rgba(0,0,0,0.7);
  }

  #view-jones .number {
    position: absolute;
    font-family: 'Orbitron', 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    color: #1f1f1f;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    line-height: 1;
    text-shadow: 0.1vmin 0.15vmin 0.1vmin rgba(255,255,255,0.4),
                 -0.1vmin -0.1vmin 0.2vmin rgba(0,0,0,0.25);
  }

  #view-jones .dot {
    position: absolute;
    background: #1f1f1f;
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    box-shadow: 0.1vmin 0.15vmin 0.1vmin rgba(255,255,255,0.3);
  }

  #view-jones .radial-major,
  #view-jones .radial-minor {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 0%;
    transform-origin: 50% 0%;
    -webkit-transform: translate(-50%, 0);
    transform: translate(-50%, 0);
    background: #1f1f1f;
    opacity: 0.15;
    box-shadow: 0.08vmin 0.12vmin 0.12vmin rgba(255,255,255,0.15);
  }

  #view-jones .radial-major {
    width: 0.35%;
    height: 20%;
  }

  #view-jones .radial-minor {
    width: 0.18%;
    height: 12%;
    opacity: 0.09;
  }

  #j-inner-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 0.2vmin dotted rgba(31,31,31,0.15);
  }

  #j-pivot {
    position: absolute;
    top: 50%;
    left: 50%;
    background:
      -webkit-radial-gradient(35% 30%, circle, #999, #222);
    background:
      radial-gradient(circle at 35% 30%, #999, #222);
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    box-shadow:
      0 0.4vmin 0.7vmin rgba(0,0,0,0.9),
      inset 0 0.12vmin 0.24vmin rgba(255,255,255,0.5);
    z-index: 6;
  }

  #j-brand {
    position: absolute;
    top: 27%;
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    font-family: 'Orbitron', "Georgia", serif;
    letter-spacing: 0.18em;
    color: #222;
    opacity: 0.55;
    text-shadow:
      0.08vmin 0.12vmin 0.12vmin rgba(255,255,255,0.5),
      -0.08vmin -0.12vmin 0.18vmin rgba(0,0,0,0.35);
  }

  /* ===================== Karlsson-style design =====================
     Beveled black "picture frame" case (mimicking the iPad's own
     rounded-rectangle bezel), soft white face, bold rounded numerals at
     2/3/4/6/8/9/10/12, diagonal dash ticks at 1/5/7/11, small dot minute
     marks elsewhere, and chunky blunt (non-tapered) hands. */

  #k-case {
    position: relative;
    border-radius: 5%;
    background: #1c1c1e;
    box-shadow:
      0 3vmin 6vmin rgba(0,0,0,0.6),
      inset 0 0.2vmin 0.4vmin rgba(255,255,255,0.06);
    /* padding set via JS as a fixed px value — see layout() */
  }

  #k-clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 3%;
    background:
      -webkit-radial-gradient(42% 36%, circle, #ded4bf 0%, #cfc3a9 55%, #b8ab8c 100%),
      -webkit-repeating-linear-gradient(0deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        rgba(0,0,0,0.02) 2px,
        rgba(0,0,0,0.02) 3px);
    background:
      radial-gradient(circle at 42% 36%, #ded4bf 0%, #cfc3a9 55%, #b8ab8c 100%),
      repeating-linear-gradient(0deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        rgba(0,0,0,0.02) 2px,
        rgba(0,0,0,0.02) 3px);
    box-shadow:
      inset 0 0 0 0.3vmin rgba(0,0,0,0.55),
      inset 0 0.5vmin 1.4vmin rgba(0,0,0,0.22),
      inset 0 -0.3vmin 0.8vmin rgba(0,0,0,0.15);
    overflow: hidden;
  }

  /* Edge vignette for depth — flat solid faces read as artificial */
  #k-clock::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 3%;
    background: -webkit-radial-gradient(50% 50%, circle, transparent 55%, rgba(0,0,0,0.18) 100%);
    background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.18) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Soft glass sheen — same technique as the Jones face's #j-glass */
  #k-glass {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 3%;
    background:
      -webkit-linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.06) 22%, transparent 45%, transparent 75%, rgba(255,255,255,0.05) 100%);
    background:
      linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.06) 22%, transparent 45%, transparent 75%, rgba(255,255,255,0.05) 100%);
    pointer-events: none;
    z-index: 10;
  }

  #k-hands-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
  }

  #view-karlsson .hand {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
  }

  /* Subtle taper, rounded tip and base — the reference's hands are
     refined and slightly tapered, not a uniform-width block, which is
     what was reading as crude/arrow-like before */
  #k-hour {
    width: 3.4%;
    height: 24%;
    margin-left: -1.7%;
    margin-top: -24%;
    background: #16130f;
    -webkit-clip-path: polygon(50% 0%, 82% 12%, 78% 100%, 22% 100%, 18% 12%);
    clip-path: polygon(50% 0%, 82% 12%, 78% 100%, 22% 100%, 18% 12%);
    border-radius: 1.2vmin 1.2vmin 0.6vmin 0.6vmin;
  }

  #k-minute {
    width: 2.7%;
    height: 35%;
    margin-left: -1.35%;
    margin-top: -35%;
    background: #16130f;
    -webkit-clip-path: polygon(50% 0%, 80% 10%, 76% 100%, 24% 100%, 20% 10%);
    clip-path: polygon(50% 0%, 80% 10%, 76% 100%, 24% 100%, 20% 10%);
    border-radius: 1vmin 1vmin 0.5vmin 0.5vmin;
  }

  /* Thin second hand — understated, matching the plain black/white
     palette (no red accent in the reference) */
  /* Same rotor-based rebuild as the Jones second hand — see comment
     there. Old height 38% / origin 71% -> head 27.0%, tail 11.0%. */
  #k-second-rotor {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #k-second-head {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0.5%;
    height: 27%;
    margin-left: -0.25%;
    margin-top: -27%;
    background: #16130f;
  }
  #k-second-tail {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0.5%;
    height: 11%;
    margin-left: -0.25%;
    background: #16130f;
  }

  #view-karlsson .number {
    position: absolute;
    /* Google Fonts (Fredoka) has now failed twice despite correct syntax
       — strong signal this is a certificate-trust issue on this device
       talking to Google's font domains specifically (same category as
       the App Store problem, different server), which I can't fix
       without being able to test on the actual hardware. Chalkboard SE
       is genuinely built into iOS — no network dependency, no risk of
       silently failing. */
    font-family: 'Orbitron', 'Chalkboard SE', Verdana, 'Helvetica Neue', Arial, sans-serif;
    font-weight: bold;
    color: #16130f;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    line-height: 1;
  }

  /* Diagonal dash ticks at 1/5/7/11, where the reference has a short
     angled line instead of a numeral */
  #view-karlsson .dash-tick {
    position: absolute;
    background: #16130f;
    -webkit-transform-origin: center;
    transform-origin: center;
  }

  /* Small round dot minute marks at the 48 non-hour positions */
  #view-karlsson .min-dot {
    position: absolute;
    background: #16130f;
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    opacity: 0.55;
  }

  #k-pivot {
    position: absolute;
    top: 50%;
    left: 50%;
    background: #16130f;
    border-radius: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    z-index: 6;
  }

  /* Version marker, both faces — for confirming the iPad is actually
     showing the latest upload rather than a cached copy */
  .version-tag {
    position: absolute;
    bottom: 3%;
    right: 3%;
    font-family: Verdana, Arial, sans-serif;
    font-size: 10px;
    color: rgba(0,0,0,0.28);
    z-index: 999;
  }
  #j-version { color: rgba(255,255,255,0.35); }
</style>
</head>
<body><div id="view-jones" class="view">
  <div id="j-case">
    <div id="j-clock">
      <div id="j-brand">Jones</div>
      <div id="j-inner-ring"></div>
      <div id="j-hands-stage">
        <div id="j-hour" class="hand"></div>
        <div id="j-minute" class="hand"></div>
        <div id="j-second-rotor">
          <div id="j-second-head"></div>
          <div id="j-second-tail">
            <div id="j-second-counterweight"></div>
          </div>
        </div>
        <div id="j-pivot"></div>
      </div>
      <div id="j-glass"></div>
      <div class="version-tag" id="j-version">v8</div>
    </div>
  </div>
</div>

<div id="view-karlsson" class="view">
  <div id="k-case">
    <div id="k-clock">
      <div id="k-hands-stage">
        <div id="k-hour" class="hand"></div>
        <div id="k-minute" class="hand"></div>
        <div id="k-second-rotor">
          <div id="k-second-head"></div>
          <div id="k-second-tail"></div>
        </div>
        <div id="k-pivot"></div>
      </div>
      <div id="k-glass"></div>
      <div class="version-tag">v8</div>
    </div>
  </div>
</div>

<div id="tap-zone"></div>

<script>
// ===================== Jones "Movie Retro" design =====================
var Jones = (function () {
  var caseEl = document.getElementById('j-case');
  var clock = document.getElementById('j-clock');
  var handsStage = document.getElementById('j-hands-stage');
  var innerRing = document.getElementById('j-inner-ring');
  var pivot = document.getElementById('j-pivot');
  var brand = document.getElementById('j-brand');
  var built = false;

  function layout() {
    var vw = window.innerWidth;
    var vh = window.innerHeight - 20; // account for the 20px status-bar offset on .view

    var caseW = Math.min(vw, vh * 1.5);
    var caseH = caseW * (2 / 3);
    if (caseH > vh) {
      caseH = vh;
      caseW = caseH * 1.5;
    }
    caseEl.style.width = caseW + 'px';
    caseEl.style.height = caseH + 'px';

    var clockRect = clock.getBoundingClientRect();
    var dialH = clockRect.height;
    var dialW = clockRect.width;

    handsStage.style.width = dialH + 'px';
    handsStage.style.height = dialH + 'px';

    var ringSize = dialW * 0.11;
    innerRing.style.width = ringSize + 'px';
    innerRing.style.height = ringSize + 'px';

    var pivotSize = dialH * 0.024;
    pivot.style.width = pivotSize + 'px';
    pivot.style.height = pivotSize + 'px';

    var numSize = Math.max(90, Math.min(dialH * 0.38, 90));
    var dots = clock.getElementsByClassName('dot');
    var numbers = clock.getElementsByClassName('number');
    for (var i = 0; i < numbers.length; i++) {
      numbers[i].style.fontSize = numSize + 'px';
    }
    var dotSize = dialW * 0.013;
    for (var j = 0; j < dots.length; j++) {
      dots[j].style.width = dotSize + 'px';
      dots[j].style.height = dotSize + 'px';
    }
    brand.style.fontSize = Math.max(9, Math.min(dialH * 0.09, 16)) + 'px';
  }

  var RX_NUM = 40, RY_NUM = 33;
  var RX_DOT = 40, RY_DOT = 33;

  function polar(rx, ry, angleDeg) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: 50 + rx * Math.cos(rad),
      y: 50 + ry * Math.sin(rad)
    };
  }

  function build() {
    if (built) return;
    built = true;

    var numerals = [
      { label: '12', angle: 0 },
      { label: '3',  angle: 90 },
      { label: '6',  angle: 180 },
      { label: '9',  angle: 270 }
    ];
    for (var n = 0; n < numerals.length; n++) {
      var pos = polar(RX_NUM, RY_NUM, numerals[n].angle);
      var el = document.createElement('div');
      el.className = 'number';
      el.textContent = numerals[n].label;
      el.style.left = pos.x + '%';
      el.style.top = pos.y + '%';
      clock.appendChild(el);
    }

    var dotAngles = [30, 60, 120, 150, 210, 240, 300, 330];
    for (var d = 0; d < dotAngles.length; d++) {
      var dpos = polar(RX_DOT, RY_DOT, dotAngles[d]);
      var dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = dpos.x + '%';
      dot.style.top = dpos.y + '%';
      clock.appendChild(dot);
    }

    for (var i = 0; i < 60; i++) {
      var angle = i * 6;
      var isMajor = i % 5 === 0;
      var line = document.createElement('div');
      line.className = isMajor ? 'radial-major' : 'radial-minor';
      var t = 'translate(-50%, 0) rotate(' + angle + 'deg)';
      line.style.webkitTransform = t;
      line.style.transform = t;
      clock.appendChild(line);
    }
  }

  var hourHand = document.getElementById('j-hour');
  var minuteHand = document.getElementById('j-minute');
  var secondHand = document.getElementById('j-second-rotor');

  function update() {
    var now = new Date();
    var sec = now.getSeconds();
    var min = now.getMinutes();
    var hr  = now.getHours() % 12;

    var secBase = sec * 6;
    var secOvershoot = secBase + (sec % 2 === 0 ? 0.8 : -0.4);

    var secT = 'rotate(' + secOvershoot + 'deg)';
    var minT = 'rotate(' + ((min * 6) + (sec * 0.1)) + 'deg)';
    var hrT  = 'rotate(' + ((hr * 30) + (min * 0.5)) + 'deg)';

    secondHand.style.webkitTransform = secT;
    secondHand.style.transform = secT;
    minuteHand.style.webkitTransform = minT;
    minuteHand.style.transform = minT;
    hourHand.style.webkitTransform = hrT;
    hourHand.style.transform = hrT;
  }

  (function setupParallax() {
    var glassEl = document.getElementById('j-glass');

    function applyTilt(beta, gamma) {
      var maxTilt = 4;
      var xTilt = (gamma / 45) * maxTilt;
      var yTilt = (beta / 45) * maxTilt;

      var caseT = 'rotateX(' + (yTilt * 0.25) + 'deg) rotateY(' + (xTilt * 0.25) + 'deg)';
      var glassT = 'translate(-1%, -1%) rotateX(' + (yTilt * 0.6) + 'deg) rotateY(' + (xTilt * 0.6) + 'deg)';

      caseEl.style.webkitTransform = caseT;
      caseEl.style.transform = caseT;
      glassEl.style.webkitTransform = glassT;
      glassEl.style.transform = glassT;
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function (event) {
        var beta = event.beta || 0;
        var gamma = event.gamma || 0;
        applyTilt(beta, gamma);
      }, true);
    }
  })();

  build();

  return { layout: layout, update: update };
})();

// ===================== Karlsson-style design =====================
var Karlsson = (function () {
  var caseEl = document.getElementById('k-case');
  var clock = document.getElementById('k-clock');
  var handsStage = document.getElementById('k-hands-stage');
  var pivot = document.getElementById('k-pivot');
  var built = false;

  function layout() {
    var vw = window.innerWidth;
    var vh = window.innerHeight - 20; // account for the 20px status-bar offset on .view

    // Same fill logic as the Jones design (proven to fill the iPad
    // screen edge-to-edge with no letterboxing) — the previous 1.75:1
    // ratio didn't match the device's actual screen shape, which left
    // dark bars that combined with the padding to look like one thick
    // frame and kept the face from filling the screen.
    var caseW = Math.min(vw, vh * 1.5);
    var caseH = caseW * (2 / 3);
    if (caseH > vh) {
      caseH = vh;
      caseW = caseH * 1.5;
    }
    caseEl.style.width = caseW + 'px';
    caseEl.style.height = caseH + 'px';

    // Thin, fixed-pixel bezel (genuinely iPad-bezel-thin) rather than a
    // percentage of the case, which scales up and looks thick on a
    // large, screen-filling case
    var bezelPx = Math.max(2, Math.min(caseH * 0.006, 5));
    caseEl.style.padding = bezelPx + 'px';

    var clockRect = clock.getBoundingClientRect();
    var dialH = clockRect.height;
    var dialW = clockRect.width;

    handsStage.style.width = dialH + 'px';
    handsStage.style.height = dialH + 'px';

    var pivotSize = dialH * 0.03;
    pivot.style.width = pivotSize + 'px';
    pivot.style.height = pivotSize + 'px';

    var numSize = Math.max(15, Math.min(dialH * 0.18, 34));
    var numbers = clock.getElementsByClassName('number');
    for (var i = 0; i < numbers.length; i++) {
      numbers[i].style.fontSize = numSize + 'px';
    }

    var dashLen = dialH * 0.09;
    var dashes = clock.getElementsByClassName('dash-tick');
    for (var j = 0; j < dashes.length; j++) {
      dashes[j].style.width = (dashLen * 0.14) + 'px';
      dashes[j].style.height = dashLen + 'px';
    }

    var minDotSize = dialW * 0.009;
    var minDots = clock.getElementsByClassName('min-dot');
    for (var m = 0; m < minDots.length; m++) {
      minDots[m].style.width = minDotSize + 'px';
      minDots[m].style.height = minDotSize + 'px';
    }
  }

  var RX_NUM = 41, RY_NUM = 39;
  var RX_TICK = 34, RY_TICK = 26;

  function polar(rx, ry, angleDeg) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: 50 + rx * Math.cos(rad),
      y: 50 + ry * Math.sin(rad)
    };
  }

  // Hour positions that show a numeral vs. a diagonal dash, matching
  // the reference photo's specific (non-standard) pattern
  var NUMBER_HOURS = { 2: 1, 3: 1, 4: 1, 6: 1, 8: 1, 9: 1, 10: 1, 12: 1 };

  function build() {
    if (built) return;
    built = true;

    for (var h = 1; h <= 12; h++) {
      var angle = h * 30;
      if (NUMBER_HOURS[h]) {
        var pos = polar(RX_NUM, RY_NUM, angle);
        var el = document.createElement('div');
        el.className = 'number';
        el.textContent = String(h);
        el.style.left = pos.x + '%';
        el.style.top = pos.y + '%';
        clock.appendChild(el);
      } else {
        var tpos = polar(RX_TICK, RY_TICK, angle);
        var dash = document.createElement('div');
        dash.className = 'dash-tick';
        dash.style.left = tpos.x + '%';
        dash.style.top = tpos.y + '%';
        var dt = 'translate(-50%, -50%) rotate(' + angle + 'deg)';
        dash.style.webkitTransform = dt;
        dash.style.transform = dt;
        clock.appendChild(dash);
      }
    }

    // Small dot minute marks at the remaining 48 (non-hour) positions
    for (var i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      var mAngle = i * 6;
      var mpos = polar(RX_TICK, RY_TICK, mAngle);
      var dot = document.createElement('div');
      dot.className = 'min-dot';
      dot.style.left = mpos.x + '%';
      dot.style.top = mpos.y + '%';
      clock.appendChild(dot);
    }
  }

  var hourHand = document.getElementById('k-hour');
  var minuteHand = document.getElementById('k-minute');
  var secondHand = document.getElementById('k-second-rotor');

  function update() {
    var now = new Date();
    var sec = now.getSeconds();
    var min = now.getMinutes();
    var hr  = now.getHours() % 12;

    var secT = 'rotate(' + (sec * 6) + 'deg)';
    var minT = 'rotate(' + ((min * 6) + (sec * 0.1)) + 'deg)';
    var hrT  = 'rotate(' + ((hr * 30) + (min * 0.5)) + 'deg)';

    secondHand.style.webkitTransform = secT;
    secondHand.style.transform = secT;
    minuteHand.style.webkitTransform = minT;
    minuteHand.style.transform = minT;
    hourHand.style.webkitTransform = hrT;
    hourHand.style.transform = hrT;
  }

  build();

  return { layout: layout, update: update };
})();

// ===================== Shared: layout, ticking, toggle =====================
function layoutAll() {
  Jones.layout();
  Karlsson.layout();
}
function updateAll() {
  Jones.update();
  Karlsson.update();
}

layoutAll();
window.addEventListener('resize', layoutAll);
window.addEventListener('orientationchange', function () {
  setTimeout(layoutAll, 100);
});

updateAll();
setInterval(updateAll, 1000);

// Tap the center of the dial to switch between designs
(function setupToggle() {
  var viewJones = document.getElementById('view-jones');
  var viewKarlsson = document.getElementById('view-karlsson');
  var tapZone = document.getElementById('tap-zone');
  var showingJones = true;

  function toggle() {
    showingJones = !showingJones;
    viewJones.style.display = showingJones ? 'flex' : 'none';
    viewKarlsson.style.display = showingJones ? 'none' : 'flex';
    // Re-measure the newly visible view — its dial was un-rendered
    // (display:none) while hidden, so getBoundingClientRect() would have
    // returned zeros for it during any layout() calls while it was off.
    layoutAll();
    updateAll();
  }

  tapZone.addEventListener('click', toggle);
  tapZone.addEventListener('touchend', function (e) {
    e.preventDefault();
    toggle();
  });
})();
</script>
